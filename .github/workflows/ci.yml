name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: docker build -t quiz-frontend:ci .

      - name: Build backend
        run: docker build -t quiz-backend:ci ./backend

      - name: Trivy frontend (bloquant sur CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL --exit-code 1 quiz-frontend:ci

      - name: Trivy backend (bloquant sur CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL --exit-code 1 quiz-backend:ci
